<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión · {{ config.business_name }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <div class="text-center mb-4">
      {% if config.logo %}
        <img src="{{ url_for('static', filename=config.logo) }}" alt="Logo" class="login-logo mb-3">
      {% else %}
        <div style="width:64px;height:64px;border-radius:14px;background:#1e2a3a;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">
          <i class="bi bi-shop text-white" style="font-size:1.8rem;"></i>
        </div>
      {% endif %}
      <h4 class="fw-bold mb-0" style="color:#1e2a3a;">{{ config.business_name }}</h4>
      <p class="text-muted small mb-0">Sistema Punto de Venta</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
    {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold small">Usuario</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Nombre de usuario"
                 required autofocus autocomplete="username">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Contraseña"
                 required autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
        <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
      </button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.75rem;">
      Usuario por defecto: <strong>admin</strong> / <strong>admin123</strong>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
